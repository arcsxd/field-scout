<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1013">
<title>Field Scout</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="map"></div>

<!-- Top bar -->
<header id="topbar">
  <div id="gpsChip" class="chip"><span class="dot"></span><span class="chipLbl">GPS</span><span id="gpsText">…</span></div>
  <div id="farmTitle" class="title"></div>
  <div id="recChip" class="chip rec hidden"><span class="recDot"></span><span id="recText">REC</span></div>
  <button id="btnLang" class="chip btn-chip">PT</button>
  <button id="btnMenu" class="chip btn-chip" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h16"/></svg></button>
</header>

<!-- Map side buttons -->
<div id="sideBtns">
  <div class="group">
    <button id="btnLocate" class="round" title="Center on me" aria-label="Center on me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" class="fill"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    <button id="btnBase" class="round" title="Map layer" aria-label="Map layer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 12.5 9 5 9-5"/><path d="m3 17 9 5 9-5" opacity=".55"/></svg></button>
  </div>
  <div class="group">
    <button id="btnTrack" class="round" title="Record track" aria-label="Record track"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5" class="fill"/></svg></button>
    <button id="btnLine" class="round" title="Line mode" aria-label="Line mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19 10 9l5 6 5-10"/><circle cx="4" cy="19" r="1.6" class="fill"/><circle cx="10" cy="9" r="1.6" class="fill"/><circle cx="15" cy="15" r="1.6" class="fill"/><circle cx="20" cy="5" r="1.6" class="fill"/></svg></button>
    <button id="btnUndo" class="round" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  </div>
</div>

<!-- Line mode banner -->
<div id="lineBanner" class="banner hidden">
  <span class="bIc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19 10 9l5 6 5-10"/><circle cx="4" cy="19" r="1.6" class="fill"/><circle cx="10" cy="9" r="1.6" class="fill"/><circle cx="15" cy="15" r="1.6" class="fill"/><circle cx="20" cy="5" r="1.6" class="fill"/></svg></span>
  <div class="bTxt"><b id="lineBannerTitle"></b><span id="lineBannerCount"></span></div>
  <button id="btnLineCancel" class="btn ghost sm" data-i18n="cancel"></button>
  <button id="btnLineFinish" class="btn ok sm" data-i18n="finish"></button>
</div>

<!-- Tap-to-place banner -->
<div id="tapBanner" class="banner hidden">
  <span class="bIc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v5M12 16v5M3 12h5M16 12h5"/><circle cx="12" cy="12" r="1.4" class="fill"/></svg></span>
  <div class="bTxt"><b data-i18n="tapTitle"></b><span data-i18n="tapHint"></span></div>
  <button id="btnTapCancel" class="btn ghost sm" data-i18n="cancel"></button>
</div>

<!-- Crosshair for map placement -->
<div id="crosshair" class="hidden"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="11" class="ring"/><path d="M24 2v12M24 34v12M2 24h12M34 24h12"/><circle cx="24" cy="24" r="1.8" class="dotc"/></svg></div>

<!-- First-run hint -->
<div id="coach" class="hidden"><span data-i18n="coach"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></div>

<!-- Bottom type palette -->
<nav id="palette"></nav>

<!-- Capture sheet -->
<section id="sheet" class="sheet hidden">
  <div class="sheet-head">
    <span id="sheetIcon" class="typeIc"></span>
    <div class="headTxt"><h2 id="sheetTitle"></h2><span id="sheetSub"></span></div>
    <button id="btnSheetClose" class="x" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="tabs" id="methodTabs">
    <span class="tabInd" aria-hidden="true"></span>
    <button data-m="gps" class="tab active" data-i18n="mGps"></button>
    <button data-m="map" class="tab" data-i18n="mMap"></button>
    <button data-m="bearing" class="tab" data-i18n="mBearing"></button>
  </div>

  <div class="pane" data-pane="gps">
    <div class="avgBox">
      <div class="avgVis">
        <div class="ringWrap">
          <svg viewBox="0 0 120 120" class="ring"><circle cx="60" cy="60" r="52" class="ringBg"/><circle id="ringFg" cx="60" cy="60" r="52" class="ringFg"/></svg>
          <div class="ringTxt"><b id="ringAcc">—</b><span id="ringSub">m</span></div>
        </div>
        <canvas id="avgScatter" width="240" height="240"></canvas>
      </div>
      <div id="avgStatus" class="mono">—</div>
      <div class="avgCtl">
        <button id="btnAvg" class="btn" data-i18n="startAvg"></button>
        <label class="secs"><select id="avgSecs"><option>5</option><option selected>10</option><option>20</option><option>30</option></select><span>sec</span></label>
      </div>
    </div>
  </div>
  <div class="pane hidden" data-pane="map">
    <div class="avgBox center">
      <p class="muted" data-i18n="mapPaneHint"></p>
      <button id="btnPickMap" class="btn" data-i18n="pickOnMap"></button>
      <div id="mapPickStatus" class="mono"></div>
    </div>
  </div>
  <div class="pane hidden" data-pane="bearing">
    <div class="avgBox">
      <p class="muted" data-i18n="bearingHint"></p>
      <div class="bearingRow">
        <div class="rose">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="46" class="roseBg"/>
            <g class="roseTicks"></g>
            <text x="50" y="16" class="roseN">N</text>
            <g id="roseArrow"><path d="M50 12 L57 50 L50 44 L43 50 Z" class="arrowTarget"/></g>
            <g id="roseLive" class="hidden"><path d="M50 18 L53 50 L47 50 Z" class="arrowLive"/></g>
          </svg>
        </div>
        <div class="col">
          <label><span data-i18n="bearingTrue"></span><div class="unit"><input id="inBearing" type="number" inputmode="decimal" step="1" min="0" max="360"><i>°</i></div></label>
          <label><span data-i18n="distance"></span><div class="unit"><input id="inDist" type="number" inputmode="decimal" step="1" min="0"><i>m</i></div></label>
        </div>
      </div>
      <div class="row">
        <button id="btnCompass" class="btn" data-i18n="useCompass"></button>
        <span id="compassLive" class="mono"></span>
      </div>
      <div id="bearingStatus" class="mono"></div>
    </div>
  </div>

  <div id="accWarn" class="warn hidden"></div>
  <div id="dupWarn" class="warn hidden"></div>
  <div class="grid2">
    <label><span data-i18n="height"></span><div class="unit"><input id="inHeight" type="number" inputmode="decimal" step="0.5" min="0" placeholder="0"><i>m</i></div></label>
    <label><span data-i18n="width"></span><div class="unit"><input id="inWidth" type="number" inputmode="decimal" step="0.5" min="0" placeholder="—"><i>m</i></div></label>
  </div>
  <label><span data-i18n="notes"></span><textarea id="inNotes" rows="2"></textarea></label>
  <div class="photos">
    <label class="photoAdd"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span data-i18n="addPhoto"></span><input id="inPhoto" type="file" accept="image/*" capture="environment" hidden></label>
    <div id="photoThumbs" class="thumbs"></div>
  </div>
  <div class="saveBar">
    <button id="btnSave" class="btn ok big" data-i18n="save" disabled></button>
  </div>
</section>

<!-- Menu sheet -->
<section id="menu" class="sheet hidden">
  <div class="sheet-head brand">
    <img src="icon-512.png" class="logo" alt="">
    <div class="headTxt"><h2>Field Scout</h2><span>v1.3 · Pyka mapping, Step 4</span></div>
    <button id="btnMenuClose" class="x" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>

  <div class="summary">
    <div id="stats" class="stats"></div>
    <div id="statsBars" class="bars"></div>
  </div>

  <h3 class="secTitle" data-i18n="secExport"></h3>
  <div class="exportBox">
    <button id="btnExportKmz" class="btn primary wide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span data-i18n="exportKmz"></span></button>
    <div class="grid2">
      <button id="btnExportKml" class="btn" data-i18n="exportKml"></button>
      <button id="btnExportCsv" class="btn" data-i18n="exportCsv"></button>
    </div>
  </div>

  <h3 class="secTitle" data-i18n="secSession"></h3>
  <div class="card form">
    <label><span data-i18n="farmName"></span><input id="inFarm" type="text"></label>
    <label><span data-i18n="operator"></span><input id="inOperator" type="text" placeholder="Ops Person A"></label>
    <label><span data-i18n="declination"></span><div class="unit"><input id="inDecl" type="number" inputmode="decimal" step="0.1"><i>°</i></div></label>
  </div>

  <h3 class="secTitle" data-i18n="secFarm"></h3>
  <div class="card rows">
    <label class="rowBtn"><span class="rIc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5 9 4l6 2.5L20 4v13.5L15 20l-6-2.5L4 20z"/><path d="M9 4v13.5M15 6.5V20"/></svg></span><span data-i18n="importKml"></span><svg viewBox="0 0 24 24" aria-hidden="true" class="chev"><path d="m9 6 6 6-6 6"/></svg><input id="inKml" type="file" accept=".kml,.kmz,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz" hidden></label>
    <button id="btnClearFarm" class="rowBtn"><span class="rIc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></span><span data-i18n="clearFarm"></span></button>
  </div>

  <h3 class="secTitle" data-i18n="secView"></h3>
  <div class="card rows">
    <button id="btnList" class="rowBtn"><span class="rIc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3" class="fill"/><circle cx="4.5" cy="12" r="1.3" class="fill"/><circle cx="4.5" cy="18" r="1.3" class="fill"/></svg></span><span data-i18n="listFeatures"></span><svg viewBox="0 0 24 24" aria-hidden="true" class="chev"><path d="m9 6 6 6-6 6"/></svg></button>
    <button id="btnLayer" class="rowBtn"><span class="rIc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 12.5 9 5 9-5"/></svg></span><span data-i18n="toggleLayer"></span><svg viewBox="0 0 24 24" aria-hidden="true" class="chev"><path d="m9 6 6 6-6 6"/></svg></button>
  </div>

  <button id="btnNew" class="btn danger wide" data-i18n="newSession"></button>
</section>

<!-- List sheet -->
<section id="list" class="sheet hidden">
  <div class="sheet-head"><div class="headTxt"><h2><span data-i18n="listFeatures"></span> <em id="listCount"></em></h2></div><button id="btnListClose" class="x" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div id="listBody"></div>
</section>

<div id="toast" class="hidden"></div>
<div id="flash" class="hidden"><div class="flashIc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div><div id="flashTxt"></div></div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/turf.min.js"></script>
<script src="vendor/togeojson.umd.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
